{{define "content"}}
{{with .Entry}}
<header class="page-head">
  <p class="eyebrow"><a href="/">Panel</a> <span aria-hidden="true">/</span> Resultado</p>
  <h1>{{.Action}}</h1>
  <p class="lead-c meta-line">
    <span><i class="bi bi-hdd-network" aria-hidden="true"></i> <span translate="no">{{.Target}}</span></span>
    <span><i class="bi bi-arrow-left-right" aria-hidden="true"></i> {{.Channel}}</span>
    <span><i class="bi bi-clock" aria-hidden="true"></i> <time class="mono" datetime="{{.Time.Format "2006-01-02T15:04:05Z07:00"}}">{{fecha .Time}}</time></span>
  </p>
</header>

{{template "outcome-operacion" .}}

<section class="block" aria-labelledby="salida-titulo">
  <h2 id="salida-titulo" class="block-title">Salida técnica</h2>
  {{template "terminal-salida" .}}
</section>

<a class="btn btn-accent" href="/"><i class="bi bi-grid-1x2" aria-hidden="true"></i> Volver al panel</a>
{{end}}
{{end}}
